<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f6f2" />
  <title>Inkasso-Defense · Cockpit (Light)</title>
  <meta name="robots" content="noindex" />

  <!--
    Inkasso-Defense · Main-UI-Hülle (helle, minimalistische Variante)
    ----------------------------------------------------------------------------
    Eigenständig (HTML/CSS/JS). Mobile-first, KEIN horizontaler Scroll.
    3 Bereiche: 1) Sticky 5-Schritte-Header  2) Intelligente Akte  3) Main Content.
    Schritte werden als Module in die Main Content Area injiziert (STEP_VIEWS).
    State: AppState.step steuert Header + Ansicht.
    ----------------------------------------------------------------------------
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />

  <style>
    /* ============================ Design-Tokens (Light) ============================ */
    :root {
      --bg:          #f7f6f2;   /* warmes Off-White / Creme */
      --surface:     #ffffff;   /* Karten */
      --surface-2:   #fbfaf7;   /* eingelassen */
      --line:        #e7e4dc;   /* Haarlinie */
      --line-soft:   #efece5;

      --ink:         #1d2630;   /* Anthrazit (Text) */
      --ink-soft:    #5b6573;   /* sekundär */
      --ink-faint:   #94a0ae;   /* tertiär */

      --accent:      #2f6f5e;   /* gedecktes Grün (Vertrauen) */
      --accent-strong:#245546;
      --accent-soft: #e7f0ec;   /* Tint */
      --amber:       #b88119;   /* Warnung/Frist (gedeckt) */
      --danger:      #b4453c;   /* dringend (gedeckt) */

      --r-lg: 18px; --r-md: 13px; --r-sm: 9px;
      --shadow-sm: 0 1px 2px rgba(29,38,48,.04), 0 1px 3px rgba(29,38,48,.06);
      --shadow:    0 8px 30px -12px rgba(29,38,48,.14);
      --ease: cubic-bezier(.16,1,.3,1);
      --header-h: 60px;
      --maxw: 1120px;
    }

    /* ============================ Reset / Base ============================ */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      overflow-x: hidden;                 /* STRIKT: nie horizontal scrollen */
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: 16px; line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
    }
    h1, h2, h3 { margin: 0; font-family: "Source Serif 4", Georgia, serif; letter-spacing: -.01em; color: var(--ink); }
    p { margin: 0; }
    a { color: var(--accent); }
    img, svg { display: block; max-width: 100%; }
    button { font: inherit; cursor: pointer; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
    .muted { color: var(--ink-soft); }
    .tnum { font-variant-numeric: tabular-nums; }

    /* ============================ 1) Sticky Header / Progress ============================ */
    .header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(247,246,242,.85); backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--line);
      padding-top: env(safe-area-inset-top);
    }
    .header__row {
      max-width: var(--maxw); margin: 0 auto; min-height: var(--header-h);
      display: flex; align-items: center; gap: 14px; padding: 8px 18px;
    }
    .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); flex: 0 0 auto; }
    .brand__mark { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
    .brand__name { font-weight: 700; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }

    /* Desktop-Stepper (passt ohne Scroll; Labels schrumpfen) */
    .steps { display: none; flex: 1 1 auto; min-width: 0; align-items: center; gap: 6px; }
    .step { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .step__num {
      flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
      display: grid; place-items: center; font-size: 12.5px; font-weight: 600;
      background: var(--surface); color: var(--ink-faint); border: 1px solid var(--line);
      transition: all .25s var(--ease);
    }
    .step__label { font-size: 13px; font-weight: 500; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .step__bar { flex: 1 1 auto; height: 1.5px; min-width: 12px; background: var(--line); }
    .step.done   .step__num { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
    .step.active .step__num { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .step.active .step__label { color: var(--ink); font-weight: 600; }
    .step.done .step__bar { background: var(--accent); }

    /* Mobile-Progress (kompakt: Text + Punkte) */
    .mprog { display: flex; flex: 1 1 auto; min-width: 0; align-items: center; justify-content: space-between; gap: 12px; }
    .mprog__eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--accent); }
    .mprog__now { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dots { display: flex; gap: 6px; flex: 0 0 auto; }
    .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); transition: all .25s var(--ease); }
    .dots i.done { background: var(--accent); opacity: .55; }
    .dots i.active { background: var(--accent); width: 20px; border-radius: 5px; }

    /* ============================ Layout ============================ */
    .wrap { max-width: var(--maxw); margin: 0 auto; padding: 18px; display: flex; flex-direction: column; gap: 16px; }

    /* 2) Intelligente Akte – Mobile: Accordion */
    .akte { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
    .akte > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 14px 16px; }
    .akte > summary::-webkit-details-marker { display: none; }
    .akte__title { flex: 1 1 auto; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
    .akte__chev { color: var(--ink-faint); transition: transform .25s var(--ease); }
    .akte[open] .akte__chev { transform: rotate(180deg); }
    .akte__grid { padding: 0 16px 16px; display: grid; gap: 1px; background: var(--line-soft); border-top: 1px solid var(--line-soft); }
    .akte__grid { padding: 0; }
    .akte__row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; padding: 13px 16px; background: var(--surface); }
    .akte__k { font-size: 13px; color: var(--ink-soft); }
    .akte__v { font-size: 14.5px; font-weight: 600; text-align: right; word-break: break-word; }
    .akte__v.empty { color: var(--ink-faint); font-weight: 500; }
    .akte__v.accent { color: var(--accent); }

    /* 3) Main Content – rein vertikal */
    .main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px; box-shadow: var(--shadow-sm); }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
    .card h2 { font-size: 23px; margin-top: 8px; }
    .lead { color: var(--ink-soft); margin-top: 8px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 22px; border-radius: 11px; border: 1px solid transparent; font-weight: 600; transition: background .18s, border-color .18s, transform .1s var(--ease); }
    .btn:active { transform: scale(.985); }
    .btn--primary { background: var(--accent); color: #fff; }
    .btn--primary:hover { background: var(--accent-strong); }
    .btn--ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
    .btn--ghost:hover { background: var(--surface-2); }
    .btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
    .row { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
    .row .btn { flex: 1 1 auto; }

    .drop { display: grid; gap: 8px; place-items: center; text-align: center; padding: 38px 16px; border: 1.5px dashed #cdd6cf; border-radius: var(--r-md); background: var(--surface-2); transition: border-color .2s, background .2s; }
    .drop.over { border-color: var(--accent); background: var(--accent-soft); }
    .drop__ic { width: 52px; height: 52px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }

    .q { border: 1px solid var(--line); border-radius: var(--r-md); padding: 15px; background: var(--surface); }
    .q + .q { margin-top: 12px; }
    .q__l { font-weight: 600; font-size: 15px; }
    .seg { display: inline-flex; margin-top: 11px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
    .seg button { border: 0; background: transparent; color: var(--ink-soft); font-weight: 600; font-size: 14px; min-height: 40px; padding: 0 20px; border-radius: 999px; }
    .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

    .kpis { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 18px; }
    .kpi { border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; background: var(--surface-2); }
    .kpi__k { font-size: 12.5px; color: var(--ink-soft); }
    .kpi__v { font-family: "Source Serif 4", serif; font-size: 27px; font-weight: 600; margin-top: 3px; }
    .kpi.save .kpi__v { color: var(--accent); }

    .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong); }

    .letter { margin-top: 16px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); padding: 16px; font-size: 14px; line-height: 1.7; color: var(--ink); white-space: pre-wrap; }

    .note { margin-top: 16px; font-size: 12.5px; color: var(--ink-faint); line-height: 1.6; }
    .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============================ Desktop ============================ */
    @media (min-width: 700px) { .kpis { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1024px) {
      .steps { display: flex; } .mprog { display: none; }
      .wrap { display: grid; grid-template-columns: minmax(0,1fr) 300px; align-items: start; gap: 26px; padding: 26px 18px; }
      .main { order: 1; }
      .akte { order: 2; position: sticky; top: calc(var(--header-h) + 26px); }
      .akte > summary { cursor: default; }
      .akte > summary .akte__chev { display: none; }
      .akte__grid { display: grid !important; }   /* native <details>-Collapse auf Desktop überschreiben */
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
  </style>
</head>

<body>
  <!-- ===================== 1) Sticky Header / Fortschritt ===================== -->
  <header class="header">
    <div class="header__row">
      <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 7.7-8 9-4.8-1.3-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
        </span>
        <span class="brand__name">Inkasso-Defense</span>
      </a>
      <nav class="steps" id="steps" aria-label="Fortschritt"></nav>
      <div class="mprog" id="mprog">
        <span style="min-width:0">
          <span class="mprog__eyebrow" id="m-eyebrow">Schritt 1 / 5</span>
          <span class="mprog__now" id="m-now" style="display:block">Dokumenten-Scan</span>
        </span>
        <span class="dots" id="m-dots" aria-hidden="true"></span>
      </div>
    </div>
  </header>

  <!-- ===================== Layout ===================== -->
  <div class="wrap">
    <!-- 2) Intelligente Akte -->
    <details class="akte" id="akte" open>
      <summary>
        <span class="brand__mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
        <span class="akte__title">Intelligente Akte</span>
        <svg class="akte__chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </summary>
      <div class="akte__grid">
        <div class="akte__row"><span class="akte__k">Inkassobüro</span><span class="akte__v empty" data-akte="inkassobuero">—</span></div>
        <div class="akte__row"><span class="akte__k">Aktenzeichen</span><span class="akte__v empty" data-akte="aktenzeichen">—</span></div>
        <div class="akte__row"><span class="akte__k">Hauptforderung</span><span class="akte__v empty tnum" data-akte="hauptforderung">—</span></div>
        <div class="akte__row"><span class="akte__k">Inkassokosten</span><span class="akte__v empty accent tnum" data-akte="inkassokosten">—</span></div>
      </div>
    </details>

    <!-- 3) Main Content (dynamisch) -->
    <main class="main" id="main" aria-live="polite"></main>
  </div>

  <script>
  (function () {
    "use strict";

    /* ===================== State ===================== */
    const AppState = {
      step: 0,
      akte: { inkassobuero: "", aktenzeichen: "", hauptforderung: null, inkassokosten: null },
      fakten: { ersterBrief: null, bereitsWidersprochen: null, bereitsGezahlt: null },
      file: null,
    };

    const STEPS = [
      { key: "scan",       label: "Dokumenten-Scan" },
      { key: "fakten",     label: "Fakten-Check" },
      { key: "analyse",    label: "KI-Analyse" },
      { key: "ergebnis",   label: "Ergebnis & Strategie" },
      { key: "gegenwehr",  label: "Gegenwehr" },
    ];

    const eur = (n) => new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" }).format(Number(n) || 0);
    const $ = (s, r) => (r || document).querySelector(s);

    /* ===================== Header rendern ===================== */
    function renderHeader() {
      $("#steps").innerHTML = STEPS.map((s, i) => {
        const cls = i < AppState.step ? "done" : i === AppState.step ? "active" : "";
        const inner = i < AppState.step
          ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
          : (i + 1);
        const bar = i < STEPS.length - 1 ? '<span class="step__bar"></span>' : "";
        return '<div class="step ' + cls + '" aria-current="' + (i === AppState.step ? "step" : "false") + '">' +
                 '<span class="step__num">' + inner + '</span><span class="step__label">' + s.label + '</span></div>' + bar;
      }).join("");
      $("#m-eyebrow").textContent = "Schritt " + (AppState.step + 1) + " / 5";
      $("#m-now").textContent = STEPS[AppState.step].label;
      $("#m-dots").innerHTML = STEPS.map((_, i) =>
        '<i class="' + (i < AppState.step ? "done" : i === AppState.step ? "active" : "") + '"></i>').join("");
    }

    /* ===================== Akte rendern ===================== */
    function renderAkte() {
      const a = AppState.akte;
      const set = (k, val) => {
        const el = document.querySelector('[data-akte="' + k + '"]'); if (!el) return;
        const empty = val == null || val === "";
        el.textContent = empty ? "—" : val; el.classList.toggle("empty", empty);
      };
      set("inkassobuero", a.inkassobuero);
      set("aktenzeichen", a.aktenzeichen);
      set("hauptforderung", a.hauptforderung == null ? "" : eur(a.hauptforderung));
      set("inkassokosten", a.inkassokosten == null ? "" : eur(a.inkassokosten));
    }

    /* ===================== Navigation ===================== */
    function goTo(step) {
      AppState.step = Math.max(0, Math.min(STEPS.length - 1, step));
      renderHeader(); renderView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function navRow(nextLabel, nextEnabled, onNext) {
      const row = document.createElement("div"); row.className = "row";
      if (AppState.step > 0) {
        const b = document.createElement("button"); b.className = "btn btn--ghost"; b.textContent = "Zurück";
        b.onclick = () => goTo(AppState.step - 1); row.appendChild(b);
      }
      if (nextLabel) {
        const n = document.createElement("button"); n.className = "btn btn--primary"; n.textContent = nextLabel;
        n.disabled = !nextEnabled; n.onclick = onNext || (() => goTo(AppState.step + 1)); row.appendChild(n);
      }
      return row;
    }
    function card(html) { const c = document.createElement("section"); c.className = "card"; c.innerHTML = html; return c; }

    /* ===================== Schritt-Module (injiziert) ===================== */
    const STEP_VIEWS = { scan: vScan, fakten: vFakten, analyse: vAnalyse, ergebnis: vErgebnis, gegenwehr: vGegenwehr };
    function renderView() {
      const main = $("#main"); main.innerHTML = "";
      STEP_VIEWS[STEPS[AppState.step].key](main);
    }

    function vScan(main) {
      const c = card(
        '<p class="eyebrow">Schritt 1</p><h2>Dokument scannen</h2>' +
        '<p class="lead">Lade ein Foto oder PDF deiner Inkasso-Forderung hoch. Wir lesen die Eckdaten automatisch aus.</p>' +
        '<label class="drop" id="dz" style="margin-top:16px">' +
          '<input id="file" type="file" accept="image/*,application/pdf" hidden />' +
          '<span class="drop__ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L8 8m4-4l4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></span>' +
          '<span id="dz-label" style="font-weight:600">Brief auswählen oder hierher ziehen</span>' +
          '<span class="muted" style="font-size:13px">JPG, PNG oder PDF · max. 10 MB</span>' +
        '</label>'
      );
      main.appendChild(c);
      const nav = navRow("Weiter zum Fakten-Check", !!AppState.file, () => goTo(1));
      main.appendChild(nav);
      const next = nav.querySelector(".btn--primary");
      const dz = $("#dz", c), input = $("#file", c), label = $("#dz-label", c);
      const onFile = (f) => {
        if (!f) return;
        AppState.file = f; label.textContent = f.name; if (next) next.disabled = false;
        // Demo: Akte-Eckdaten (im Live-System aus der KI-Extraktion).
        AppState.akte = { inkassobuero: "Adler & Voß Inkasso GmbH", aktenzeichen: "AV-2026/04417", hauptforderung: 129.00, inkassokosten: 78.50 };
        renderAkte();
      };
      input.addEventListener("change", (e) => onFile(e.target.files[0]));
      ["dragenter","dragover"].forEach((ev)=>dz.addEventListener(ev,(e)=>{e.preventDefault();dz.classList.add("over");}));
      ["dragleave","drop"].forEach((ev)=>dz.addEventListener(ev,(e)=>{e.preventDefault();dz.classList.remove("over");}));
      dz.addEventListener("drop",(e)=>onFile(e.dataTransfer && e.dataTransfer.files[0]));
    }

    function vFakten(main) {
      const f = AppState.fakten;
      const q = (key, label) => '<div class="q" data-q="' + key + '"><div class="q__l">' + label + '</div>' +
        '<div class="seg" role="group" aria-label="' + label + '"><button data-v="true" aria-pressed="' + (f[key]===true) + '">Ja</button>' +
        '<button data-v="false" aria-pressed="' + (f[key]===false) + '">Nein</button></div></div>';
      const c = card(
        '<p class="eyebrow">Schritt 2</p><h2>Fakten-Check</h2>' +
        '<p class="lead">Drei kurze Angaben für eine präzise Einschätzung.</p>' +
        '<div style="margin-top:16px">' +
          q("ersterBrief","Ist das der erste Brief in dieser Sache?") +
          q("bereitsWidersprochen","Hast du bereits widersprochen?") +
          q("bereitsGezahlt","Hast du bereits (teilweise) gezahlt?") +
        '</div>'
      );
      main.appendChild(c);
      main.appendChild(navRow("KI-Analyse starten", true, () => goTo(2)));
      c.querySelectorAll(".seg button").forEach((btn) => btn.addEventListener("click", () => {
        const key = btn.closest("[data-q]").dataset.q;
        f[key] = btn.dataset.v === "true";
        btn.parentElement.querySelectorAll("button").forEach((x)=>x.setAttribute("aria-pressed", x===btn));
      }));
    }

    function vAnalyse(main) {
      main.appendChild(card(
        '<p class="eyebrow">Schritt 3</p><h2>KI-Analyse</h2>' +
        '<div style="display:flex;align-items:center;gap:14px;margin-top:18px">' +
          '<span class="spin"></span><span class="lead" style="margin:0">Die Forderung wird nach geltendem Verbraucherrecht geprüft …</span></div>'
      ));
      // Demo: nach kurzer Zeit zum Ergebnis. (Live: POST /api/analyze)
      setTimeout(() => goTo(3), 1400);
    }

    function vErgebnis(main) {
      const a = AppState.akte;
      const orig = (Number(a.hauptforderung)||0) + (Number(a.inkassokosten)||0);
      const fair = Number(a.hauptforderung) || 0;
      const save = Number(a.inkassokosten) || 0;
      const c = card(
        '<span class="pill"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 7.7-8 9-4.8-1.3-8-4.5-8-9V6l8-3z"/></svg>Basiert auf geltendem Verbraucherrecht</span>' +
        '<h2 style="margin-top:12px">Ergebnis & Strategie</h2>' +
        '<p class="lead">Empfehlung: Teilwiderspruch – erkenne nur den fairen Kern an, widersprich den Inkassokosten.</p>' +
        '<div class="kpis">' +
          '<div class="kpi"><div class="kpi__k">Geforderte Summe</div><div class="kpi__v tnum">' + eur(orig) + '</div></div>' +
          '<div class="kpi save"><div class="kpi__k">Fairer Kern</div><div class="kpi__v tnum">' + eur(fair) + '</div></div>' +
          '<div class="kpi"><div class="kpi__k">Ersparnis</div><div class="kpi__v tnum">' + eur(save) + '</div></div>' +
        '</div>'
      );
      main.appendChild(c);
      main.appendChild(navRow("Schriftsatz erstellen", true, () => goTo(4)));
    }

    function vGegenwehr(main) {
      const a = AppState.akte;
      const text =
        "Betreff: Teilwiderspruch – Aktenzeichen " + (a.aktenzeichen || "—") + "\n\n" +
        "Sehr geehrte Damen und Herren,\n\n" +
        "hiermit widerspreche ich der geltend gemachten Forderung teilweise. Den unstrittigen Betrag von " +
        eur(a.hauptforderung) + " erkenne ich an. Den Inkassokosten in Höhe von " + eur(a.inkassokosten) +
        " widerspreche ich; einer Übermittlung an Auskunfteien (z. B. SCHUFA) widerspreche ich ausdrücklich.\n\n" +
        "Mit freundlichen Grüßen";
      const c = card(
        '<p class="eyebrow">Schritt 5</p><h2>Gegenwehr · Schriftsatz</h2>' +
        '<p class="lead">Dein fertiger Teilwiderspruch – prüfen, kopieren und senden.</p>' +
        '<div class="letter" id="letter">' + text.replace(/</g,"&lt;") + '</div>' +
        '<div class="row"><button class="btn btn--primary" id="copy">Schriftsatz kopieren</button>' +
        '<button class="btn btn--ghost" id="pdf">Als PDF</button></div>' +
        '<p class="note">Automatisierte Ersteinschätzung basierend auf geltenden Gesetzen – ersetzt keine anwaltliche Rechtsberatung.</p>'
      );
      main.appendChild(c);
      main.appendChild(navRow(null));
      $("#copy", c).addEventListener("click", function () {
        (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
          .then(() => { this.textContent = "Kopiert ✓"; }).catch(() => {});
      });
    }

    /* ===================== Init ===================== */
    const mq = window.matchMedia("(min-width: 1024px)");
    const syncAkte = () => { if (mq.matches) $("#akte").setAttribute("open", ""); };
    (mq.addEventListener ? mq.addEventListener("change", syncAkte) : mq.addListener(syncAkte)); syncAkte();

    renderHeader(); renderAkte(); renderView();
    window.InkassoCockpit = { AppState, goTo }; // für Integration/Debug
  })();
  </script>
</body>
</html>
