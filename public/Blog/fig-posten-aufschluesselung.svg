<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI',Roboto,system-ui,-apple-system,sans-serif">
  <title>Aufschlüsselung einer Forderung in berechtigten Kern und oft überhöhte Gebühren</title>
  <rect width="1600" height="900" fill="#0b0f19"/>
  <text x="800" y="160" fill="#94a3b8" font-size="32" letter-spacing="3" text-anchor="middle">AUFSCHLÜSSELUNG DER GESAMTFORDERUNG</text>

  <!-- Segmentlabels -->
  <g font-size="28" fill="#94a3b8" text-anchor="middle">
    <text x="540" y="360">Hauptforderung</text>
    <text x="1075" y="360">Gebühren</text>
    <text x="1330" y="360">Pauschalen</text>
  </g>

  <!-- Stacked bar -->
  <g>
    <rect x="160" y="390" width="760" height="130" rx="10" fill="#12b886"/>
    <rect x="924" y="390" width="300" height="130" fill="#f87171"/>
    <rect x="1228" y="390" width="212" height="130" rx="10" fill="#ef4444" fill-opacity="0.85"/>
    <text x="540" y="475" fill="#06231b" font-size="42" font-weight="700" text-anchor="middle">120 €</text>
    <text x="1074" y="475" fill="#3a1414" font-size="34" font-weight="700" text-anchor="middle">89 €</text>
    <text x="1334" y="475" fill="#3a1414" font-size="30" font-weight="700" text-anchor="middle">60 €</text>
  </g>

  <!-- Klammern -->
  <g stroke-width="4" fill="none">
    <path d="M160 560 v22 h760 v-22" stroke="#12b886"/>
    <path d="M924 560 v22 h516 v-22" stroke="#f87171"/>
  </g>
  <text x="540" y="640" fill="#6ee7c4" font-size="32" font-weight="700" text-anchor="middle">Fairer Kern – berechtigt</text>
  <text x="1182" y="640" fill="#f87171" font-size="32" font-weight="700" text-anchor="middle">oft überhöht / streichbar</text>

  <!-- Hinweis -->
  <g transform="translate(160,720)">
    <rect x="0" y="0" width="1280" height="80" rx="16" fill="#131c2e" stroke="#243047" stroke-width="2"/>
    <text x="40" y="52" fill="#cbd5e1" font-size="30">Jeden Posten einzeln prüfen – Hauptforderung getrennt von Gebühren &amp; Pauschalen.</text>
  </g>
</svg>
