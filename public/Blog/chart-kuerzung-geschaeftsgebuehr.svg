<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI',Roboto,system-ui,-apple-system,sans-serif">
  <title>Typische Kürzung der Geschäftsgebühr: geltend gemacht 100 Prozent gegenüber berechtigt rund 69 Prozent</title>
  <rect width="1600" height="900" fill="#0b0f19"/>
  <text x="120" y="150" fill="#6ee7c4" font-size="30" font-weight="700" letter-spacing="3">TYPISCHE KÜRZUNG DER GESCHÄFTSGEBÜHR</text>

  <line x1="160" y1="720" x2="1440" y2="720" stroke="#243047" stroke-width="3"/>

  <!-- Balken 1: geltend gemacht 100% -->
  <g>
    <rect x="430" y="250" width="280" height="470" rx="14" fill="#f87171" fill-opacity="0.9"/>
    <text x="570" y="500" fill="#3a1414" font-size="60" font-weight="800" text-anchor="middle">100%</text>
    <text x="570" y="780" fill="#f87171" font-size="32" font-weight="700" text-anchor="middle">geltend gemacht</text>
  </g>

  <!-- Balken 2: berechtigt ~69% -->
  <g>
    <rect x="890" y="396" width="280" height="324" rx="14" fill="#12b886"/>
    <text x="1030" y="560" fill="#06231b" font-size="56" font-weight="800" text-anchor="middle">69%</text>
    <text x="1030" y="780" fill="#6ee7c4" font-size="32" font-weight="700" text-anchor="middle">berechtigt (Schwelle)</text>
  </g>

  <!-- Delta -->
  <g>
    <path d="M730 320 H872" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <path d="M872 320 l-26 -16 v32 z" fill="#fbbf24"/>
    <rect x="700" y="270" width="200" height="56" rx="28" fill="#3a2f17"/>
    <text x="800" y="308" fill="#fbbf24" font-size="32" font-weight="800" text-anchor="middle">−31 %</text>
  </g>
</svg>
