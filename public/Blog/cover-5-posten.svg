<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI',Roboto,system-ui,-apple-system,sans-serif">
  <title>Inkassoschreiben mit fünf geprüften Posten, einige überhöht</title>
  <defs>
    <radialGradient id="g5" cx="78%" cy="18%" r="80%">
      <stop offset="0%" stop-color="#12b886" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#0b0f19"/>
  <rect width="1600" height="900" fill="url(#g5)"/>

  <!-- Dokument -->
  <g>
    <rect x="330" y="150" width="760" height="620" rx="28" fill="#131c2e" stroke="#243047" stroke-width="2"/>
    <text x="380" y="232" fill="#94a3b8" font-size="26" letter-spacing="3">ZAHLUNGSAUFFORDERUNG</text>
    <rect x="380" y="258" width="300" height="8" rx="4" fill="#2a3650"/>

    <!-- 5 Posten -->
    <g font-size="30">
      <!-- 1 ok -->
      <circle cx="396" cy="350" r="9" fill="#12b886"/>
      <rect x="430" y="338" width="360" height="24" rx="12" fill="#33415c"/>
      <text x="1020" y="360" fill="#cbd5e1" text-anchor="end">120 €</text>
      <!-- 2 überhöht -->
      <circle cx="396" cy="430" r="9" fill="#f87171"/>
      <rect x="430" y="418" width="430" height="24" rx="12" fill="#3a2530"/>
      <text x="1020" y="440" fill="#f87171" text-anchor="end">89 €</text>
      <!-- 3 ok -->
      <circle cx="396" cy="510" r="9" fill="#12b886"/>
      <rect x="430" y="498" width="300" height="24" rx="12" fill="#33415c"/>
      <text x="1020" y="520" fill="#cbd5e1" text-anchor="end">20 €</text>
      <!-- 4 überhöht -->
      <circle cx="396" cy="590" r="9" fill="#f87171"/>
      <rect x="430" y="578" width="470" height="24" rx="12" fill="#3a2530"/>
      <text x="1020" y="600" fill="#f87171" text-anchor="end">40 €</text>
      <!-- 5 überhöht -->
      <circle cx="396" cy="670" r="9" fill="#f87171"/>
      <rect x="430" y="658" width="400" height="24" rx="12" fill="#3a2530"/>
      <text x="1020" y="680" fill="#f87171" text-anchor="end">15 €</text>
    </g>
  </g>

  <!-- Lupe -->
  <g transform="translate(980,470)">
    <circle cx="0" cy="0" r="150" fill="#0e1424" stroke="#12b886" stroke-width="10" opacity="0.96"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#6ee7c4" stroke-width="2" opacity="0.5"/>
    <line x1="108" y1="108" x2="210" y2="210" stroke="#12b886" stroke-width="26" stroke-linecap="round"/>
    <text x="0" y="22" fill="#6ee7c4" font-size="120" font-weight="700" text-anchor="middle">5</text>
  </g>

  <!-- Label -->
  <g transform="translate(120,150)">
    <rect x="0" y="0" width="250" height="52" rx="26" fill="#12b886" fill-opacity="0.14"/>
    <text x="28" y="34" fill="#6ee7c4" font-size="24" font-weight="700" letter-spacing="2">POSTEN-CHECK</text>
  </g>
</svg>
