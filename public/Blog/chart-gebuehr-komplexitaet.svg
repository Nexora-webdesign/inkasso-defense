<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI',Roboto,system-ui,-apple-system,sans-serif">
  <title>Geschäftsgebühr nach Komplexität: 0,9 einfaches Inkasso, 1,3 Schwelle, 2,5 Maximum</title>
  <rect width="1600" height="900" fill="#0b0f19"/>
  <text x="120" y="150" fill="#6ee7c4" font-size="30" font-weight="700" letter-spacing="3">GESCHÄFTSGEBÜHR NACH KOMPLEXITÄT</text>

  <line x1="160" y1="720" x2="1440" y2="720" stroke="#243047" stroke-width="3"/>

  <!-- Schwellen-Linie bei 1,3 -->
  <line x1="160" y1="476" x2="1440" y2="476" stroke="#12b886" stroke-width="2" stroke-dasharray="10 10" opacity="0.6"/>
  <text x="1430" y="466" fill="#6ee7c4" font-size="24" text-anchor="end">Schwelle 1,3</text>

  <!-- 0,9 -->
  <g>
    <rect x="330" y="551" width="240" height="169" rx="14" fill="#12b886"/>
    <text x="450" y="640" fill="#06231b" font-size="50" font-weight="800" text-anchor="middle">0,9</text>
    <text x="450" y="780" fill="#94a3b8" font-size="28" text-anchor="middle">einfaches Inkasso</text>
  </g>
  <!-- 1,3 -->
  <g>
    <rect x="680" y="476" width="240" height="244" rx="14" fill="#12b886"/>
    <rect x="680" y="476" width="240" height="244" rx="14" fill="none" stroke="#6ee7c4" stroke-width="4"/>
    <text x="800" y="600" fill="#06231b" font-size="50" font-weight="800" text-anchor="middle">1,3</text>
    <text x="800" y="780" fill="#6ee7c4" font-size="28" font-weight="700" text-anchor="middle">Schwelle (Regelfall)</text>
  </g>
  <!-- 2,5 -->
  <g>
    <rect x="1030" y="250" width="240" height="470" rx="14" fill="#f87171" fill-opacity="0.9"/>
    <text x="1150" y="500" fill="#3a1414" font-size="50" font-weight="800" text-anchor="middle">2,5</text>
    <text x="1150" y="780" fill="#f87171" font-size="28" text-anchor="middle">Maximum</text>
  </g>
</svg>
