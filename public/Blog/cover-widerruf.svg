<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI',Roboto,system-ui,-apple-system,sans-serif">
  <title>14 Tage Widerrufsrecht bei Online-Käufen</title>
  <defs><radialGradient id="cw" cx="50%" cy="14%" r="85%"><stop offset="0%" stop-color="#12b886" stop-opacity="0.2"/><stop offset="60%" stop-color="#0b0f19" stop-opacity="0"/></radialGradient></defs>
  <rect width="1600" height="900" fill="#0b0f19"/><rect width="1600" height="900" fill="url(#cw)"/>
  <text x="800" y="160" fill="#94a3b8" font-size="30" letter-spacing="4" text-anchor="middle">WIDERRUFSRECHT · ONLINE-KAUF</text>

  <!-- Paket -->
  <g transform="translate(420,470)">
    <rect x="-170" y="-150" width="340" height="300" rx="14" fill="#26334d"/>
    <path d="M-170 -150 H170 V-40 H-170 Z" fill="#33415c"/>
    <rect x="-30" y="-150" width="60" height="300" fill="#1b2740" opacity="0.6"/>
    <text x="0" y="20" fill="#94a3b8" font-size="40" font-weight="700" text-anchor="middle">Paket</text>
  </g>
  <!-- Rückgabe-Pfeil -->
  <g transform="translate(700,470)" fill="none" stroke="#6ee7c4" stroke-width="14" stroke-linecap="round">
    <path d="M0 -40 a120 120 0 1 0 110 -70"/>
  </g>
  <path d="M790 -20 l30 70 l-75 -10 z" transform="translate(700,470)" fill="#6ee7c4"/>

  <!-- 14 Tage Badge -->
  <g transform="translate(980,360)">
    <rect width="420" height="220" rx="24" fill="#0e2a22" stroke="#12b886" stroke-width="3"/>
    <text x="210" y="120" fill="#6ee7c4" font-size="110" font-weight="800" text-anchor="middle">14</text>
    <text x="210" y="180" fill="#e2e8f0" font-size="40" font-weight="700" text-anchor="middle">Tage Widerruf</text>
  </g>
</svg>
