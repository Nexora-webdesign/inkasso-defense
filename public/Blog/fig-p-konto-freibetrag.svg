<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI',Roboto,system-ui,-apple-system,sans-serif">
  <title>Kontoguthaben: geschützter Grundfreibetrag gegenüber pfändbarem Betrag darüber</title>
  <rect width="1600" height="900" fill="#0b0f19"/>
  <text x="120" y="140" fill="#6ee7c4" font-size="30" font-weight="700" letter-spacing="3">DEIN GUTHABEN AUF DEM P-KONTO</text>

  <!-- Balken -->
  <rect x="200" y="250" width="1200" height="160" rx="16" fill="#12b886"/>
  <rect x="1000" y="250" width="400" height="160" rx="16" fill="#3a2530"/>
  <rect x="1000" y="250" width="400" height="160" fill="none"/>
  <line x1="1000" y1="240" x2="1000" y2="420" stroke="#0b0f19" stroke-width="4"/>

  <text x="600" y="350" fill="#06231b" font-size="40" font-weight="800" text-anchor="middle">geschützter Freibetrag</text>
  <text x="1200" y="340" fill="#fca5a5" font-size="34" font-weight="800" text-anchor="middle">pfändbar</text>

  <!-- Schild über Freibetrag -->
  <g transform="translate(600,500)">
    <path d="M0 -40 L46 -22 V14 C46 44 26 62 0 72 C-26 62 -46 44 -46 14 V-22 Z" fill="#0e2a22" stroke="#12b886" stroke-width="4"/>
    <path d="M-18 8 l13 14 l24 -30" fill="none" stroke="#12b886" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="600" y="630" fill="#6ee7c4" font-size="28" font-weight="700" text-anchor="middle">bleibt dir – auch bei Pfändung</text>
  <text x="1200" y="500" fill="#94a3b8" font-size="26" text-anchor="middle">nur der Teil über</text>
  <text x="1200" y="535" fill="#94a3b8" font-size="26" text-anchor="middle">dem Freibetrag</text>

  <g transform="translate(200,690)"><rect width="1200" height="90" rx="16" fill="#131c2e" stroke="#243047" stroke-width="2"/><text x="40" y="56" fill="#cbd5e1" font-size="30">Jedes Girokonto lässt sich kostenlos in ein P-Konto umwandeln – ein Konto pro Person.</text></g>
</svg>
