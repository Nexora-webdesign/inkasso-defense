<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI',Roboto,system-ui,-apple-system,sans-serif">
  <title>Gegenüberstellung Gebührensatz 1,9 angesetzt gegenüber 1,3 berechtigt, rund 32 Prozent zu viel</title>
  <rect width="1600" height="900" fill="#0b0f19"/>
  <text x="800" y="150" fill="#94a3b8" font-size="32" letter-spacing="3" text-anchor="middle">GEBÜHRENSATZ: ANGESETZT VS. BERECHTIGT</text>

  <line x1="200" y1="720" x2="1400" y2="720" stroke="#243047" stroke-width="3"/>

  <!-- 1,9 angesetzt (rot) -->
  <g>
    <rect x="420" y="250" width="300" height="470" rx="14" fill="#f87171" fill-opacity="0.9"/>
    <text x="570" y="500" fill="#3a1414" font-size="96" font-weight="800" text-anchor="middle">1,9</text>
    <text x="570" y="790" fill="#f87171" font-size="34" font-weight="700" text-anchor="middle">angesetzt</text>
  </g>

  <!-- 1,3 berechtigt (mint) -->
  <g>
    <rect x="880" y="400" width="300" height="320" rx="14" fill="#12b886"/>
    <text x="1030" y="580" fill="#06231b" font-size="96" font-weight="800" text-anchor="middle">1,3</text>
    <text x="1030" y="790" fill="#6ee7c4" font-size="34" font-weight="700" text-anchor="middle">berechtigt (Schwelle)</text>
  </g>

  <!-- Differenz-Pfeil -->
  <g>
    <path d="M740 320 H860" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <path d="M860 320 l-26 -16 v32 z" fill="#fbbf24"/>
    <rect x="700" y="270" width="200" height="56" rx="28" fill="#3a2f17"/>
    <text x="800" y="308" fill="#fbbf24" font-size="32" font-weight="800" text-anchor="middle">−32 %</text>
  </g>
</svg>
