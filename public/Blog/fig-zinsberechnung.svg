<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI',Roboto,system-ui,-apple-system,sans-serif">
  <title>Zinsberechnung: Hauptforderung mal Zinssatz mal Zeitraum ergibt die Verzugszinsen</title>
  <rect width="1600" height="900" fill="#0b0f19"/>
  <text x="800" y="180" fill="#94a3b8" font-size="32" letter-spacing="3" text-anchor="middle">VERZUGSZINSEN SCHRITT FÜR SCHRITT</text>

  <g font-size="26" fill="#94a3b8" text-anchor="middle">
    <text x="230" y="370">Hauptforderung</text>
    <text x="620" y="370">Zinssatz (Verbraucher)</text>
    <text x="985" y="370">Zeitraum</text>
    <text x="1330" y="370">Verzugszinsen</text>
  </g>

  <!-- Boxen -->
  <g>
    <rect x="80" y="400" width="300" height="200" rx="18" fill="#26334d"/>
    <text x="230" y="520" fill="#e2e8f0" font-size="48" font-weight="700" text-anchor="middle">120 €</text>

    <rect x="470" y="400" width="300" height="200" rx="18" fill="#0e2a22" stroke="#12b886" stroke-width="2"/>
    <text x="620" y="500" fill="#6ee7c4" font-size="42" font-weight="800" text-anchor="middle">5 PP</text>
    <text x="620" y="545" fill="#9fe7cf" font-size="24" text-anchor="middle">über Basiszins</text>

    <rect x="860" y="400" width="250" height="200" rx="18" fill="#26334d"/>
    <text x="985" y="505" fill="#e2e8f0" font-size="40" font-weight="700" text-anchor="middle">Tage</text>
    <text x="985" y="548" fill="#94a3b8" font-size="24" text-anchor="middle">im Verzug</text>

    <rect x="1180" y="400" width="300" height="200" rx="18" fill="#12b886"/>
    <text x="1330" y="520" fill="#06231b" font-size="44" font-weight="800" text-anchor="middle">= Zinsen</text>
  </g>

  <!-- Operatoren -->
  <g fill="#64748b" font-size="56" font-weight="700" text-anchor="middle">
    <text x="425" y="520">×</text>
    <text x="815" y="520">×</text>
    <text x="1145" y="515">=</text>
  </g>

  <!-- Hinweis -->
  <g transform="translate(80,690)">
    <rect x="0" y="0" width="1400" height="90" rx="16" fill="#131c2e" stroke="#243047" stroke-width="2"/>
    <text x="40" y="56" fill="#cbd5e1" font-size="30">Nur auf die Hauptforderung – und nur mit dem zulässigen Satz (Verbraucher: 5 PP über Basiszins).</text>
  </g>
</svg>
