<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI',Roboto,system-ui,-apple-system,sans-serif">
  <title>Schuldanerkenntnis nicht vorschnell unterschreiben</title>
  <defs><radialGradient id="cs" cx="72%" cy="16%" r="82%"><stop offset="0%" stop-color="#f87171" stop-opacity="0.16"/><stop offset="60%" stop-color="#0b0f19" stop-opacity="0"/></radialGradient></defs>
  <rect width="1600" height="900" fill="#0b0f19"/><rect width="1600" height="900" fill="url(#cs)"/>
  <text x="800" y="160" fill="#94a3b8" font-size="30" letter-spacing="4" text-anchor="middle">SCHULDANERKENNTNIS</text>

  <!-- Dokument -->
  <g transform="translate(440,250) rotate(-3)">
    <rect x="0" y="0" width="500" height="430" rx="12" fill="#ece8e0"/>
    <text x="40" y="70" fill="#1c2347" font-size="32" font-weight="800">Schuldanerkenntnis</text>
    <rect x="40" y="110" width="420" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="40" y="140" width="360" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="40" y="170" width="400" height="10" rx="5" fill="#cbd5e1"/>
    <text x="40" y="300" fill="#64748b" font-size="24">Unterschrift</text>
    <path d="M40 360 q60 -50 120 -10 t120 -10" fill="none" stroke="#1c2347" stroke-width="5"/>
    <line x1="40" y1="390" x2="320" y2="390" stroke="#94a3b8" stroke-width="3"/>
  </g>
  <!-- Stift -->
  <g transform="translate(770,560) rotate(40)"><rect x="0" y="0" width="40" height="240" rx="8" fill="#12b886"/><path d="M0 240 L20 290 L40 240 Z" fill="#6ee7c4"/><rect x="0" y="0" width="40" height="40" rx="8" fill="#0c8f6a"/></g>

  <!-- Warnung -->
  <g transform="translate(1060,360)">
    <path d="M120 0 L240 210 H0 Z" fill="#fbbf24"/>
    <text x="120" y="170" fill="#3a2f0a" font-size="120" font-weight="800" text-anchor="middle">!</text>
    <text x="120" y="270" fill="#fbbf24" font-size="30" font-weight="700" text-anchor="middle">erst prüfen</text>
  </g>
</svg>
