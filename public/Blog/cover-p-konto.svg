<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI',Roboto,system-ui,-apple-system,sans-serif">
  <title>P-Konto schützt das Existenzminimum vor Pfändung</title>
  <defs><radialGradient id="cp" cx="50%" cy="14%" r="85%"><stop offset="0%" stop-color="#12b886" stop-opacity="0.2"/><stop offset="60%" stop-color="#0b0f19" stop-opacity="0"/></radialGradient></defs>
  <rect width="1600" height="900" fill="#0b0f19"/><rect width="1600" height="900" fill="url(#cp)"/>
  <text x="800" y="160" fill="#94a3b8" font-size="30" letter-spacing="4" text-anchor="middle">PFÄNDUNGSSCHUTZKONTO (P-KONTO)</text>

  <!-- Pfändungspfeil (blockiert) -->
  <g transform="translate(250,470)">
    <path d="M0 -34 H150 V-70 L260 0 L150 70 V34 H0 Z" fill="#f87171" fill-opacity="0.85"/>
    <text x="120" y="12" fill="#3a1414" font-size="30" font-weight="800" text-anchor="middle">Pfändung</text>
  </g>

  <!-- Schild -->
  <g transform="translate(820,470)">
    <path d="M0 -200 L180 -130 V20 C180 140 100 210 0 250 C-100 210 -180 140 -180 20 V-130 Z" fill="#0e2a22" stroke="#12b886" stroke-width="8"/>
    <path d="M-70 10 l50 55 l95 -120" fill="none" stroke="#12b886" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="170" fill="#6ee7c4" font-size="34" font-weight="800" text-anchor="middle">geschützt</text>
  </g>

  <!-- Freibetrag-Karte -->
  <g transform="translate(1140,360)">
    <rect width="340" height="210" rx="20" fill="#131c2e" stroke="#243047" stroke-width="2"/>
    <text x="30" y="60" fill="#94a3b8" font-size="24">Grundfreibetrag</text>
    <text x="30" y="120" fill="#6ee7c4" font-size="48" font-weight="800">≈ 1.560 €</text>
    <text x="30" y="170" fill="#64748b" font-size="22">pro Monat (Stand prüfen)</text>
  </g>
</svg>
