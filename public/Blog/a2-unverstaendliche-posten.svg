<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI',Roboto,system-ui,-apple-system,sans-serif">
  <title>Rechnungsposten: nachvollziehbare Posten gegenüber unklaren Pauschalen mit Fragezeichen</title>
  <rect width="1600" height="900" fill="#0b0f19"/>
  <rect x="120" y="110" width="1360" height="700" rx="28" fill="#131c2e" stroke="#243047" stroke-width="2"/>

  <text x="170" y="200" fill="#94a3b8" font-size="30" letter-spacing="3">RECHNUNGSPOSTEN</text>
  <line x1="170" y1="226" x2="1430" y2="226" stroke="#243047" stroke-width="2"/>

  <g font-size="38">
    <!-- nachvollziehbar -->
    <g>
      <circle cx="200" cy="300" r="11" fill="#12b886"/>
      <text x="244" y="314" fill="#e2e8f0">Hauptforderung</text>
      <text x="1400" y="314" fill="#cbd5e1" text-anchor="end">120,00 €</text>
    </g>
    <g>
      <circle cx="200" cy="380" r="11" fill="#12b886"/>
      <text x="244" y="394" fill="#e2e8f0">Auslagenpauschale (max. 20 €)</text>
      <text x="1400" y="394" fill="#cbd5e1" text-anchor="end">20,00 €</text>
    </g>

    <!-- unklar -->
    <g>
      <rect x="160" y="440" width="1280" height="60" rx="14" fill="#3a2f17"/>
      <circle cx="200" cy="470" r="11" fill="#fbbf24"/>
      <text x="244" y="484" fill="#fde68a">Bearbeitungspauschale</text>
      <text x="980" y="484" fill="#fbbf24" font-weight="700">?</text>
      <text x="1400" y="484" fill="#fbbf24" text-anchor="end">35,00 €</text>
    </g>
    <g>
      <rect x="160" y="520" width="1280" height="60" rx="14" fill="#3a2f17"/>
      <circle cx="200" cy="550" r="11" fill="#fbbf24"/>
      <text x="244" y="564" fill="#fde68a">IT- / Kontoführungskosten</text>
      <text x="980" y="564" fill="#fbbf24" font-weight="700">?</text>
      <text x="1400" y="564" fill="#fbbf24" text-anchor="end">18,00 €</text>
    </g>
    <g>
      <rect x="160" y="600" width="1280" height="60" rx="14" fill="#3a2f17"/>
      <circle cx="200" cy="630" r="11" fill="#fbbf24"/>
      <text x="244" y="644" fill="#fde68a">Verwaltungsaufwand</text>
      <text x="980" y="644" fill="#fbbf24" font-weight="700">?</text>
      <text x="1400" y="644" fill="#fbbf24" text-anchor="end">25,00 €</text>
    </g>
  </g>

  <!-- Legende -->
  <g font-size="28" transform="translate(170,730)">
    <circle cx="11" cy="-9" r="11" fill="#12b886"/>
    <text x="40" y="0" fill="#94a3b8">nachvollziehbar</text>
    <circle cx="411" cy="-9" r="11" fill="#fbbf24"/>
    <text x="440" y="0" fill="#94a3b8">unklar – Bezeichnung prüfen</text>
  </g>
</svg>
