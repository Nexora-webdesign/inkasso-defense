<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI',Roboto,system-ui,-apple-system,sans-serif">
  <title>Zeitstrahl: Zustellung, 14 Tage Widerspruchsfrist, dann Widerspruch oder Vollstreckungsbescheid</title>
  <rect width="1600" height="900" fill="#0b0f19"/>
  <text x="120" y="140" fill="#6ee7c4" font-size="30" font-weight="700" letter-spacing="3">DIE 14-TAGE-FRIST</text>

  <!-- Zeitstrahl -->
  <line x1="180" y1="360" x2="900" y2="360" stroke="#243047" stroke-width="6"/>
  <circle cx="180" cy="360" r="16" fill="#6ee7c4"/>
  <text x="180" y="320" fill="#e2e8f0" font-size="30" font-weight="700" text-anchor="middle">Zustellung</text>

  <rect x="220" y="345" width="640" height="30" rx="15" fill="#fbbf24" fill-opacity="0.85"/>
  <text x="540" y="430" fill="#fbbf24" font-size="30" font-weight="700" text-anchor="middle">14 Tage Widerspruchsfrist</text>
  <circle cx="900" cy="360" r="16" fill="#94a3b8"/>

  <!-- Gabelung -->
  <path d="M900 360 H1040 V230 H1180" fill="none" stroke="#12b886" stroke-width="5"/>
  <path d="M900 360 H1040 V500 H1180" fill="none" stroke="#f87171" stroke-width="5"/>

  <!-- Option gut -->
  <g transform="translate(1180,180)">
    <rect width="300" height="110" rx="16" fill="#0e2a22" stroke="#12b886" stroke-width="2"/>
    <text x="24" y="50" fill="#6ee7c4" font-size="30" font-weight="800">Widerspruch ✓</text>
    <text x="24" y="86" fill="#9fe7cf" font-size="24">Verfahren wird gestoppt</text>
  </g>
  <!-- Option schlecht -->
  <g transform="translate(1180,450)">
    <rect width="300" height="110" rx="16" fill="#2a1416" stroke="#f87171" stroke-width="2"/>
    <text x="24" y="50" fill="#fca5a5" font-size="30" font-weight="800">Nichts tun ✗</text>
    <text x="24" y="86" fill="#fca5a5" font-size="24">Vollstreckungsbescheid</text>
  </g>

  <g transform="translate(180,640)"><rect width="1240" height="90" rx="16" fill="#131c2e" stroke="#243047" stroke-width="2"/><text x="40" y="56" fill="#cbd5e1" font-size="30">Widerspruch geht formlos mit dem beiliegenden Vordruck – fristgerecht ans Gericht.</text></g>
</svg>
