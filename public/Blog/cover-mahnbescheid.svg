<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI',Roboto,system-ui,-apple-system,sans-serif">
  <title>Gerichtlicher Mahnbescheid mit 14-Tage-Frist</title>
  <defs><radialGradient id="cm" cx="75%" cy="18%" r="80%"><stop offset="0%" stop-color="#12b886" stop-opacity="0.18"/><stop offset="60%" stop-color="#0b0f19" stop-opacity="0"/></radialGradient></defs>
  <rect width="1600" height="900" fill="#0b0f19"/><rect width="1600" height="900" fill="url(#cm)"/>

  <!-- gelber Brief -->
  <g transform="rotate(-5 470 470)">
    <rect x="250" y="210" width="440" height="520" rx="10" fill="#f0e2a0"/>
    <text x="290" y="290" fill="#3a2f0a" font-size="34" font-weight="800">MAHNBESCHEID</text>
    <text x="290" y="330" fill="#6b5b1a" font-size="22">Amtsgericht · Mahnverfahren</text>
    <rect x="290" y="370" width="360" height="10" rx="5" fill="#cdbd76"/>
    <rect x="290" y="400" width="300" height="10" rx="5" fill="#cdbd76"/>
    <rect x="290" y="470" width="340" height="10" rx="5" fill="#d8cb8c"/>
    <rect x="290" y="500" width="280" height="10" rx="5" fill="#d8cb8c"/>
    <rect x="290" y="560" width="200" height="56" rx="8" fill="#b91c1c"/>
    <text x="390" y="597" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">FRIST LÄUFT</text>
  </g>

  <!-- Uhr/Countdown -->
  <g transform="translate(1080,460)">
    <circle r="170" fill="#0e1424" stroke="#12b886" stroke-width="10"/>
    <circle r="170" fill="none" stroke="#243047" stroke-width="10" stroke-dasharray="180 1068" stroke-dashoffset="-90" transform="rotate(-90)"/>
    <text y="-10" fill="#6ee7c4" font-size="130" font-weight="800" text-anchor="middle">14</text>
    <text y="70" fill="#94a3b8" font-size="40" font-weight="700" text-anchor="middle">TAGE</text>
  </g>
  <g transform="translate(120,150)"><rect width="290" height="52" rx="26" fill="#f87171" fill-opacity="0.14"/><text x="28" y="34" fill="#fca5a5" font-size="24" font-weight="700" letter-spacing="2">GELBER BRIEF</text></g>
</svg>
